name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/learn/Dockerfile
          target: test
          build-args: BASE=python:3.12-slim
          load: true
          tags: unitracker-learn-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm unitracker-learn-test
